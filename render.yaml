services:
  - type: web
    name: event-registration-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: FLASK_SESSION_COOKIE_SECURE
        value: "true"
      - key: CAMPUSCONNECT_ORGANIZER_USERNAME
        sync: false
      - key: CAMPUSCONNECT_ORGANIZER_EMAIL
        sync: false
